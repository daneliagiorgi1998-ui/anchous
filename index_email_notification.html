<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dear Anchous 🐟</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070a10}
.stage{position:relative;width:100vw;height:100vh;background:url("background.png") center/cover no-repeat}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
#lighter{left:39%;top:16%;width:23%;height:25%}
#yes{left:22%;top:52%;width:28%;height:11%}
#no{left:54%;top:52%;width:28%;height:11%}
.overlay{display:none;position:absolute;inset:0;align-items:center;justify-content:center;padding:22px;background:rgba(4,6,12,.82);backdrop-filter:blur(8px)}
.card{width:min(92vw,430px);padding:30px 22px;text-align:center;color:#fff;border-radius:28px;background:rgba(18,20,30,.96);box-shadow:0 25px 80px #0009;font-family:Arial,sans-serif}
.card h2{font-size:30px;margin:0 0 12px}.card p{font-size:18px;line-height:1.5}.close{margin-top:20px;padding:11px 22px;border:0;border-radius:99px;background:#333;color:#fff;font-weight:700}
.heart{position:fixed;pointer-events:none;font-size:26px;animation:fall 2.8s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0}}
</style>
</head>
<body>
<div class="stage">
<button id="lighter" class="hotspot" aria-label="სანთებელა"></button>
<button id="yes" class="hotspot" aria-label="კი"></button>
<button id="no" class="hotspot" aria-label="არა"></button>

<div class="overlay" id="welcome"><div class="card">
<h2>ანჩოუ 🐟❤️</h2><p>ერთი პატარა კითხვა მაქვს...</p><p><b>დეითზე წამოხვალ?</b></p>
<button class="close" onclick="closeBox('welcome')">დავხუროთ ✨</button>
</div></div>

<div class="overlay" id="yesBox"><div class="card">
<h2>ვიცოდიიი 😭❤️</h2><p>კარგი, ანჩოუს — დეითი გვაქვს 🐟✨</p>
<p style="opacity:.75">ადგილს და დროს მერე მოვიფიქრებთ.</p>
<button class="close" onclick="closeBox('yesBox')">❤️</button>
</div></div>

<div class="overlay" id="noBox"><div class="card">
<h2>კარგი 😌</h2><p>არანაირი პრობლემა ❤️</p><p style="opacity:.75">მთავარია პასუხი შენი იყოს.</p>
<button class="close" onclick="closeBox('noBox')">🐟</button>
</div></div>
</div>

<script>
lighter.onclick=()=>welcome.style.display='flex';
yes.onclick=async ()=>{
  yesBox.style.display='flex';

  // Send "YES" notification to your email via FormSubmit
  fetch('https://formsubmit.co/ajax/YOUR_EMAIL@example.com',{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({
      subject:'❤️ YES! — დეითზე თანხმობა',
      message:'ანჩოუსმა დააჭირა „კი, ნამდვილად“ 🐟❤️✨',
      _captcha:'false'
    })
  }).catch(()=>{});

  for(let i=0;i<28;i++){
    let h=document.createElement('div');
    h.className='heart';
    h.textContent=['❤️','🐟','✨','💕'][Math.floor(Math.random()*4)];
    h.style.left=Math.random()*100+'vw';
    h.style.top='-30px';
    h.style.animationDelay=Math.random()*1.2+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),3500);
  }
};
no.onclick=()=>noBox.style.display='flex';
function closeBox(id){document.getElementById(id).style.display='none'}
</script>
</body>
</html>
